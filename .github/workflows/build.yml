name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:  # 手動觸發

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          
      - name: Generate Gradle Wrapper (if missing)
        run: |
          cd android-app
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
        
      - name: Build Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease --no-daemon
          
      - name: Verify APK
        run: |
          ls -la android-app/app/build/outputs/apk/release/
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-remote-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          retention-days: 30
          
      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}